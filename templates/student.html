<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Press - Student</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
        }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1e293b;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { font-weight: 700; color: var(--primary); margin-bottom: 1.5rem; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary); }

        #buzzer {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: #cbd5e1;
            color: white;
            font-size: 2rem;
            font-weight: 700;
            cursor: not-allowed;
            box-shadow: 0 8px 0 #94a3b8;
            transition: all 0.1s;
            position: relative;
            user-select: none;
        }

        #buzzer.active {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 8px 0 #b91c1c;
            cursor: pointer;
        }

        #buzzer.active:active {
            box-shadow: 0 2px 0 #b91c1c;
            transform: translateY(6px);
        }

        #buzzer:disabled { opacity: 0.8; }

        #countdown {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            height: 80px;
            margin-bottom: 1rem;
        }

        .status-msg { margin-top: 1rem; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SPEED PRESS</h1>
        <input type="text" id="username" placeholder="กรอกชื่อของคุณ..." maxlength="15">
        
        <div id="countdown"></div>
        
        <button id="buzzer" disabled>WAIT</button>
        
        <div class="status-msg" id="msg">กรอกชื่อแล้วรออาจารย์สั่งเริ่ม...</div>
    </div>

    <script>
        const socket = io();
        const buzzer = document.getElementById('buzzer');
        const countdownDisplay = document.getElementById('countdown');
        const usernameInput = document.getElementById('username');
        const msg = document.getElementById('msg');

        socket.on('countdown', (data) => {
            let count = data.seconds;
            buzzer.disabled = true;
            buzzer.innerText = "READY";
            msg.innerText = "เตรียมตัวให้พร้อม!";
            
            let timer = setInterval(() => {
                countdownDisplay.innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    countdownDisplay.innerText = "GO!";
                }
                count--;
            }, 1000);
        });

        socket.on('unlock_button', () => {
            buzzer.disabled = false;
            buzzer.classList.add('active');
            buzzer.innerText = "PUSH!";
        });

        buzzer.addEventListener('click', () => {
            if (!usernameInput.value.trim()) {
                alert("เฮ้! ลืมใส่ชื่อ");
                return;
            }
            const timestamp = Date.now();
            socket.emit('press_button', { name: usernameInput.value, time: timestamp });
            
            buzzer.disabled = true;
            buzzer.classList.remove('active');
            buzzer.innerText = "DONE!";
            msg.innerText = "ส่งข้อมูลไปแล้ว รอดูผลลัพธ์!";
        });

        socket.on('reset_all', () => {
            buzzer.disabled = true;
            buzzer.classList.remove('active');
            buzzer.innerText = "WAIT";
            countdownDisplay.innerText = "";
            msg.innerText = "รอรอบใหม่จากอาจารย์...";
        });
    </script>
</body>
</html>
